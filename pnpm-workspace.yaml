packages:
  - "."

# Install platform-specific native optional deps for both the CI/build host
# (Linux x64 glibc — Cloudflare Pages) and local dev (Darwin arm64/x64).
# Without this, pnpm skips @voidzero-dev/vite-plus-linux-x64-gnu on Linux and
# the `prepare` script (`vp config`) crashes with "Cannot find native binding".
supportedArchitectures:
  os:
    - linux
    - darwin
    - current
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - current

overrides:
  # Vite+ 1.1.0 bundles Vitest 5.0.3 and refuses to run `--coverage` unless the
  # installed coverage provider is the same version (mixed versions otherwise
  # fails CI at startup). Both the override and the catalog entry below track the
  # `vitest` catalog range, so a future bump moves them together.
  "@vitest/coverage-v8": "catalog:"
  # vite-plus hard-pins its own `vite` dependency to an exact
  # `npm:@voidzero-dev/vite-plus-core@<version>` alias; routing every `vite`
  # dependency through the catalog keeps the whole graph (vite-plus, plugins,
  # vitest) on one core copy, which is what keeps PluginOption types identical
  # for `tsc --noEmit` in vite.config.ts. No package depends on
  # @voidzero-dev/vite-plus-core directly, so no separate core override is
  # needed — the alias target below is the single source of truth.
  vite@*: "catalog:"
  vitest@*: "catalog:"

allowBuilds:
  "@posthog/cli": true
  better-sqlite3: false
  core-js: true
  esbuild: true
  sharp: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@^1.1.0
  vitest: ^5.0.3
  vite-plus: ^1.1.0
  "@vitest/coverage-v8": ^5.0.3
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
# Supply-chain hardening: refuse any version whose trust signals (provenance,
# signatures) regressed versus what we already resolved.
#
# Fresh releases are held back by pnpm's default `minimumReleaseAge` (1440
# minutes) — no repo-level override.
trustPolicy: no-downgrade
