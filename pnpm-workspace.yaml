packages:
  - "."

# Install platform-specific native optional deps for both the CI/build host
# (Linux x64 glibc — Cloudflare Pages) and local dev (Darwin arm64/x64).
# Without this, pnpm skips @voidzero-dev/vite-plus-linux-x64-gnu on Linux and
# the `prepare` script (`vp config`) crashes with "Cannot find native binding".
supportedArchitectures:
  os:
    - linux
    - darwin
    - current
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - current

overrides:
  # vite-plus 0.3.1 bundles vitest@4.1.11 and refuses to run `--coverage` unless
  # the installed coverage provider is the exact same version (mixed versions
  # otherwise fails CI at startup).
  "@vitest/coverage-v8": "4.1.11"
  # Force vite-plus's internal hard-pinned @voidzero-dev/vite-plus-core dep to
  # match the top-level `vite` alias. Without this, pnpm installs two copies of
  # core (the alias version + vite-plus's pinned version) and the divergent
  # PluginOption types break `tsc --noEmit` in vite.config.ts.
  "@voidzero-dev/vite-plus-core": "^0.3.0"
  vite@*: "catalog:"
  vitest@*: "catalog:"

allowBuilds:
  "@posthog/cli": true
  better-sqlite3: false
  core-js: true
  esbuild: true
  sharp: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vitest: 5.0.1
  vite-plus: 0.3.1
  "@vitest/coverage-v8": 5.0.1
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
# Supply-chain hardening: refuse any version whose trust signals (provenance,
# signatures) regressed versus what we already resolved, and hold back releases
# that are too fresh to have been vetted.
#
# `minimumReleaseAge` is measured against this lockfile, not guessed: the newest
# resolved version is ~4 days old, so 6480 (4.5d) and up reject the committed
# lockfile ("entries that the active policies reject") while 4320 (3d) installs
# clean. Raise it toward the 10080 (7d) recommendation as the pinned versions
# age; bump a dependency sooner by adding it to `minimumReleaseAgeExclude`.
trustPolicy: no-downgrade
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@ai-sdk/gateway@4.0.51"
  - "@cloudflare/vite-plugin@1.52.1"
  - "@posthog/browser-common@0.6.0"
  - "@posthog/core@1.48.11"
  - "@posthog/types@1.406.1"
  - ai@7.0.64
  - miniflare@5.20260811.1-alpha
  - posthog-js@1.419.4
  - posthog-node@5.51.2
  - wrangler@4.123.0
