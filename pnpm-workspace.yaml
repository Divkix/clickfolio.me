packages:
  - "."

# Install platform-specific native optional deps for both the CI/build host
# (Linux x64 glibc — Cloudflare Pages) and local dev (Darwin arm64/x64).
# Without this, pnpm skips @voidzero-dev/vite-plus-linux-x64-gnu on Linux and
# the `prepare` script (`vp config`) crashes with "Cannot find native binding".
supportedArchitectures:
  os:
    - linux
    - darwin
    - current
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - current

overrides:
  # Vite+ 1.1.0 bundles Vitest 5.0.3 and refuses to run `--coverage` unless the
  # installed coverage provider is the same version (mixed versions otherwise
  # fails CI at startup).
  "@vitest/coverage-v8": "^5.0.3"
  # Force vite-plus's internal @voidzero-dev/vite-plus-core dep to match the
  # top-level `vite` alias. Without this, pnpm installs two copies of core (the
  # alias version + vite-plus's pinned version) and the divergent PluginOption
  # types break `tsc --noEmit` in vite.config.ts.
  "@voidzero-dev/vite-plus-core": "^1.1.0"
  vite@*: "catalog:"
  vitest@*: "catalog:"

allowBuilds:
  "@posthog/cli": true
  better-sqlite3: false
  core-js: true
  esbuild: true
  sharp: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@^1.1.0
  vitest: ^5.0.3
  vite-plus: ^1.1.0
  "@vitest/coverage-v8": ^5.0.3
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
# Supply-chain hardening: refuse any version whose trust signals (provenance,
# signatures) regressed versus what we already resolved.
#
# Fresh releases are held back by pnpm's default `minimumReleaseAge` (1440
# minutes) — no repo-level override.
trustPolicy: no-downgrade
