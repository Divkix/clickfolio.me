version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    # Hold every version update for a week so a bad publish can be yanked.
    # Security updates ignore cooldown.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    groups:
      # Vite+ moves its toolchain in lockstep (vite-plus + the `vite`/`vitest`
      # catalog aliases + the coverage provider), so group it FIRST: these are
      # only ever bumped together, or `--coverage`/`tsc --noEmit` break.
      toolchain-minor-patch:
        patterns:
          - "vite"
          - "vite-plus"
          - "vitest"
          - "@vitest/*"
          - "@voidzero-dev/*"
        update-types:
          - "minor"
          - "patch"
      # Patches ship as one PR. Minors and majors stay ungrouped, one PR per
      # package, so each carries its own release notes and CI result.
      all-patch:
        patterns:
          - "*"
        update-types:
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "ci"
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
