version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    # Hold every version update for a day so a bad publish can be yanked
    # (Dependabot's own default is 3 days). Security updates ignore cooldown.
    cooldown:
      default-days: 1
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    groups:
      # Vite+ moves its toolchain in lockstep (vite-plus + the `vite`/`vitest`
      # catalog aliases + the coverage provider), so group it FIRST: these are
      # only ever bumped together, or `--coverage`/`tsc --noEmit` break.
      toolchain-minor-patch:
        patterns:
          - "vite"
          - "vite-plus"
          - "vitest"
          - "@vitest/*"
          - "@voidzero-dev/*"
        update-types:
          - "minor"
          - "patch"
      # Everything else: minor/patch updates arrive as one group.
      # Majors stay ungrouped and are never auto-merged.
      all-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "ci"
      - "dependencies"
