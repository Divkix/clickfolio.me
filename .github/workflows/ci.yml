name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup

      - name: Run full verification
        run: pnpm run verify

      - name: Check schema migration drift
        run: |
          pnpm run db:generate
          if [[ -n "$(git status --porcelain migrations_pg)" ]]; then
            echo "Schema changes require committed migrations_pg output"
            git status --short migrations_pg
            exit 1
          fi

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup

      - name: Run tests with coverage
        # Vitest 5 defaults to cores minus one; these public Linux runners have four.
        run: pnpm run test:coverage --maxWorkers=4

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm run build

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [quality, test, build]
    # A cancelled run was superseded by concurrency; do not turn it into a red gate.
    if: always() && !cancelled()
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.quality.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI checks passed successfully"
